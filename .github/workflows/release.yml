name: Release

on:
  push:
    tags: ['v*']
    branches: ['claude/youthful-galileo-m7zzud']  # temporary: lets the branch run before the workflow is on main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pack the module into the XGoogle assets
        run: |
          python3 -I - pack module xgoogle/src/main/assets/xapps-module.zip <<'PY'
          import os, sys, zipfile
          with zipfile.ZipFile(sys.argv[3], "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk(sys.argv[2]):
                  for f in files:
                      path = os.path.join(root, f)
                      z.write(path, os.path.relpath(path, sys.argv[2]).replace(os.sep, "/"))
          PY

      - name: Build the release APK, signed with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.XAPPS_KEYSTORE_BASE64 }}
          XAPPS_KEYSTORE_PASSWORD: ${{ secrets.XAPPS_KEYSTORE_PASSWORD }}
          XAPPS_KEY_ALIAS: ${{ secrets.XAPPS_KEY_ALIAS }}
          XAPPS_KEY_PASSWORD: ${{ secrets.XAPPS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing the XAPPS_KEYSTORE_BASE64 secret; refusing to sign with the debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export XAPPS_KEYSTORE="$RUNNER_TEMP/release.jks"
          sh ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect artifacts
        run: |
          version=$(grep '^version=' module/module.prop | cut -d= -f2)
          cp app/build/outputs/apk/release/app-release.apk "XApps-$version.apk"
          cp xgoogle/src/main/assets/xapps-module.zip "XApps-$version.zip"
          (cd "$(mktemp -d)" && cp "$GITHUB_WORKSPACE/XApps-$version.apk" xapps.apk \
            && zip -q "$GITHUB_WORKSPACE/XApps-$version.zip" xapps.apk)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: XApps-${{ env.VERSION }}
          path: |
            XApps-*.apk
            XApps-*.zip

      - name: Publish a draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          files: |
            XApps-*.apk
            XApps-*.zip
